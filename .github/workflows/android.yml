name: Pong checks and Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pong-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Web regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run android:sync
      - run: npm test
      - name: Check generated files are current
        run: git diff --exit-code -- pong.html android/capacitor.settings.gradle android/app/capacitor.build.gradle

  android:
    name: Android build and lint
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - run: npm ci
      - run: npm run android:sync
      - name: Restore consistent debug signing key
        # PR builds use a disposable key and never receive this secret.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          PONG_DEBUG_KEYSTORE_BASE64: ${{ secrets.PONG_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$PONG_DEBUG_KEYSTORE_BASE64" ]; then
            echo '::error::Add the repository Actions secret PONG_DEBUG_KEYSTORE_BASE64. See docs/GITHUB_ACTIONS.md.'
            exit 1
          fi
          PONG_DEBUG_KEYSTORE_PATH="$RUNNER_TEMP/pong-signing/debug.keystore"
          install -d -m 700 "$(dirname "$PONG_DEBUG_KEYSTORE_PATH")"
          printf '%s' "$PONG_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$PONG_DEBUG_KEYSTORE_PATH"
          chmod 600 "$PONG_DEBUG_KEYSTORE_PATH"
          keytool -list -keystore "$PONG_DEBUG_KEYSTORE_PATH" -alias androiddebugkey -storepass android > /dev/null
          echo "PONG_DEBUG_KEYSTORE_PATH=$PONG_DEBUG_KEYSTORE_PATH" >> "$GITHUB_ENV"
      - name: Compile APK and run Android lint
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug lintDebug
      - name: Verify APK signature and name download
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          PONG_SIGNATURE_REPORT=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/debug/app-debug.apk)
          printf '%s\n' "$PONG_SIGNATURE_REPORT"
          PONG_EXPECTED_CERT=$(keytool -exportcert -keystore "$PONG_DEBUG_KEYSTORE_PATH" -alias androiddebugkey -storepass android | sha256sum | cut -d ' ' -f 1)
          PONG_ACTUAL_CERT=$(printf '%s\n' "$PONG_SIGNATURE_REPORT" | awk -F ': ' '/^Signer #1 certificate SHA-256 digest:/ {print $2}')
          if [ -z "$PONG_ACTUAL_CERT" ] || [ "$PONG_ACTUAL_CERT" != "$PONG_EXPECTED_CERT" ]; then
            echo '::error::APK signing certificate does not match the configured CI key. Refusing to upload an incompatible update.'
            exit 1
          fi
          PONG_VERSION=$(node -p "require('./package.json').version")
          mkdir -p apk-download
          cp android/app/build/outputs/apk/debug/app-debug.apk "apk-download/pong-${PONG_VERSION}-${GITHUB_SHA::7}-debug.apk"
          {
            echo '### Pong APK ready'
            echo "Built commit: $GITHUB_SHA"
            echo 'Download the pong-android-apk artifact below, extract the ZIP, and open the APK on Android.'
            echo 'This is a debug build for testing, not a Play Store release.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload installable APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: pong-android-apk
          path: apk-download/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload Android lint report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: android-lint-report
          path: android/app/build/reports/lint-results-debug.*
          retention-days: 14
      - name: Remove signing key from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/pong-signing/debug.keystore"

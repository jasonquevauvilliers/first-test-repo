name: Pong checks and Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pong-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Web regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run android:sync
      - run: npm test
      - name: Check generated files are current
        run: git diff --exit-code -- pong.html android/capacitor.settings.gradle android/app/capacitor.build.gradle

  android:
    name: Android build and lint
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - run: npm ci
      - run: npm run android:sync
      - name: Restore consistent debug signing key
        # PR builds use a disposable key and never receive this secret.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          PONG_DEBUG_KEYSTORE_BASE64: ${{ secrets.PONG_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$PONG_DEBUG_KEYSTORE_BASE64" ]; then
            echo '::error::Add the repository Actions secret PONG_DEBUG_KEYSTORE_BASE64. See docs/GITHUB_ACTIONS.md.'
            exit 1
          fi
          install -d -m 700 "$HOME/.android"
          printf '%s' "$PONG_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android > /dev/null
      - name: Compile APK and run Android lint
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug lintDebug
      - name: Verify APK signature and name download
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
          PONG_VERSION=$(node -p "require('./package.json').version")
          mkdir -p apk-download
          cp android/app/build/outputs/apk/debug/app-debug.apk "apk-download/pong-${PONG_VERSION}-${GITHUB_SHA::7}-debug.apk"
          {
            echo '### Pong APK ready'
            echo "Built commit: $GITHUB_SHA"
            echo 'Download the pong-android-apk artifact below, extract the ZIP, and open the APK on Android.'
            echo 'This is a debug build for testing, not a Play Store release.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload installable APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pong-android-apk
          path: apk-download/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload Android lint report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-lint-report
          path: android/app/build/reports/lint-results-debug.*
          retention-days: 14
      - name: Remove signing key from runner
        if: always()
        run: rm -f "$HOME/.android/debug.keystore"
